 ## Geo Secondary
 global:
   # See docs.gitlab.com/charts/charts/globals
   # Configure host & domain
   hosts:
     domain: shanghai.example.com
     # use a unified URL (same external URL as the primary site)
     gitlab:
       name: gitlab.example.com
   # configure DB connection
   psql:
     host: geo-2.db.example.com
     port: 5432
     password:
       secret: geo
       key: postgresql-password
   actionCableAllowedOrigins:
     - https://gitlab.london.example.com # primary internal URL
     - https://gitlab.shanghai.example.com # secondary internal URL
     - https://gitlab.example.com # unified URL
   # configure geo (secondary)
   geo:
     enabled: true
     role: secondary
     nodeName: Shanghai Office
     psql:
       host: geo-2.db.example.com
       port: 5431
       password:
         secret: geo
         key: geo-postgresql-password
 gitlab:
   webservice:
     # Configure a Ingress for internal Geo traffic
     extraIngress:
       enabled: true
       hostname: shanghai.gitlab.example.com
 # External DB, disable
 postgresql:
   install: false
