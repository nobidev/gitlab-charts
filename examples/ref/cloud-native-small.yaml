# Cloud Native - Small (S) - ≤100 RPS
# https://docs.gitlab.com/administration/reference_architectures/cloud_native.html

gitlab:
  webservice:
    maxReplicas: 9
    minReplicas: 6 # Min pods set to ~2/3 of max to accommodate autoscaling behavior
    maxUnavailable: 4
    hpa:
      cpu:
        targetAverageValue: 1600m # Increased to stabilize scaling and accommodate higher CPU load
    resources:
      limits:
        memory: 7G
      requests:
        cpu: 4 # requests.cpu <= workerProcesses
        memory: 5G
    workerProcesses: 4
    ingress:
      proxyBodySize: 0 # To allow large file uploads like imports
    nodeSelector:
      workload: webservice

  sidekiq:
    maxReplicas: 12
    minReplicas: 8 # Min pods set to ~2/3 of max to accommodate autoscaling behavior
    maxUnavailable: 6
    hpa:
      cpu:
        targetAverageValue: 700m # Increased to stabilize scaling and accommodate higher CPU load
    resources:
      limits:
        memory: 4G
      requests:
        cpu: 900m
        memory: 2G
    nodeSelector:
      workload: sidekiq

  gitaly:
    nodeSelector:
      workload: gitaly
    resources:
      limits:
        cpu: 7
        memory: 30G
      requests:
        cpu: 7
        memory: 30G
    persistence:
      storageClass: "standard"
      size: "250Gi" # Adjust based on repository size requirements
    packObjectsCache:
      enabled: true
    cgroups:
      enabled: true
      memoryBytes: 27000000000
      cpuShares: '1024'
      repositories:
        count: 1 # Starting point; tune based on repository workload patterns
    antiAffinity: hard
    securityContext:
      fsGroupChangePolicy: OnRootMismatch
    # Short timeout is intentional: rely on client-side retry rather than blocking new requests.
    # See https://docs.gitlab.com/administration/gitaly/kubernetes/#gitaly-graceful-shutdown-timeout
    gracefulRestartTimeout: 1

  toolbox:
    backups:
      # GCS is used as an example here. See the reference architecture documentation
      # for all supported object storage options and configuration.
      objectStorage:
        backend: gcs
        config:
          secret: gitlab-object-storage
          key: config

  migrations:
    # Migrations pod must point directly to the PostgreSQL primary
    psql:
      host: postgresql.example.com
      port: 5432
      password:
        secret: gitlab-postgres-password
        key: password

global:
  # Set pods to deploy on support node pool by default.
  # This ensures only Webservice, Sidekiq, and Gitaly workloads
  # are deployed to their respective node pools.
  nodeSelector:
    workload: support

  hosts:
    domain: example.com
    https: true

  ingress:
    enabled: false # Replaced by Gateway API

  gatewayApi:
    enabled: true
    installEnvoy: true
    configureCertmanager: true

  appConfig:
    # For object storage configuration options, see:
    # https://docs.gitlab.com/administration/reference_architectures/cloud_native/
    object_store:
      enabled: true
      connection:
        secret: gitlab-object-storage
        key: connection
    artifacts:
      bucket: gitlab-artifacts
      proxy_download: false
    lfs:
      bucket: gitlab-lfs
      proxy_download: false
    packages:
      bucket: gitlab-packages
      proxy_download: false
    uploads:
      bucket: gitlab-uploads
      proxy_download: false
    externalDiffs:
      enabled: true
      bucket: gitlab-external-diffs
      when: outdated
      proxy_download: false
    dependencyProxy:
      enabled: true
      bucket: gitlab-dependency-proxy
      proxy_download: false
    terraformState:
      enabled: true
      bucket: gitlab-terraform-state
      proxy_download: false
    ciSecureFiles:
      bucket: gitlab-ci-secure-files
      enabled: true
    backups:
      bucket: gitlab-backups

  psql:
    host: postgresql.example.com
    port: 5432
    password:
      secret: gitlab-postgres-password
      key: password
    # Read replicas optional but recommended for improved stability
    # load_balancing:
    #   hosts:
    #     - postgresql-replica-1.example.com
    #     - postgresql-replica-2.example.com

  redis:
    cache:
      host: redis-cache.example.com
      port: 6379
      password:
        secret: gitlab-redis-cache-password
        key: password
    host: redis-persistent.example.com
    port: 6379
    auth:
      secret: gitlab-redis-persistent-password
      key: password

  gitaly:
    enabled: true
    internal:
      names:
        - default
        - storage1
        - storage2

  registry:
    bucket: gitlab-registry

  minio:
    enabled: false

# Disable bundled NGINX Ingress controller
nginx-ingress:
  enabled: false

# Configure bundled cert-manager for Gateway API support
certmanager:
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true

# Run one Envoy proxy pod per webservice node; scales automatically as the node pool grows
gatewayApiResources:
  envoy:
    proxySpec:
      provider:
        type: Kubernetes
        kubernetes:
          envoyService:
            type: LoadBalancer
          envoyDaemonSet:
            pod:
              annotations:
                gitlab.com/prometheus_scrape: "true"
                gitlab.com/prometheus_port: "19001"
                gitlab.com/prometheus_path: "/stats/prometheus"
              nodeSelector:
                workload: webservice

registry:
  storage:
    secret: gitlab-registry-storage
    key: config

# Run Redis outside of cluster
redis:
  install: false

# Run PostgreSQL outside of cluster
postgresql:
  install: false

# https://docs.gitlab.com/ci/runners/configure_runners/
gitlab-runner:
  install: false
