{{/*
Backend B for secret provisioning: hand the manifest to a controller.

Rendered when `shared-secrets.provider` is `controller`. Instead of a hook Job and the
RBAC it needs, the chart declares what has to exist and a controller reconciles it. That
is what allows the GitLab Operator to manage releases outside its own namespace: it has
no permission to create RBAC, and this backend needs none.

This template is deliberately close to a passthrough. Everything under `spec.secrets` comes
from gitlab.secrets.manifest; the only transformation is dropping fields that mean nothing
to a controller -- the `comment` and per-field `note` documentation, and the `file`,
`certFile` and `keyFile` scratch paths that exist only because the job writes to a
temporary directory.

`spec.certificates` is not driven by the manifest. There is exactly one self-signed
authority, and it produces three related Secrets rather than keys within one, so expressing
it as a manifest entry would buy nothing. Under `provider: job` the same certificates come
from shared-secrets/self-signed-cert-job.yml, which reads the same values.

A `secret` value in the chart's values only renames a Secret, so user-supplied names appear
here too. The controller only fills in what is missing, which makes that safe: an existing
value is never overwritten, and a Secret the user pre-created only gains the keys it lacks.
That is also what lets a release pick up secret fields added in a later chart version.

Contract for whoever implements the controller (see doc/development/secrets_controller.md):

  - The generated Secrets MUST NOT carry an ownerReference back to this resource.
    Kubernetes would garbage-collect every one of them when the resource is deleted,
    taking db_key_base with it and making every encrypted column in the database
    unreadable. The Job leaves its Secrets deliberately unowned; so must the controller.
  - Never overwrite a key that already has a value; generate only the keys that are missing.
*/}}
{{- if and (index .Values "shared-secrets" "enabled") (eq (include "gitlab.shared-secrets.provider" .) "controller") }}
{{ include "gitlab.secrets.document" . }}
{{- end }}
