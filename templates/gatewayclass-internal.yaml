{{- if and (eq "true" (include "gitlab.gatewayApi.internal.enabled" .)) .Values.global.gatewayApi.installEnvoy -}}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ include "gitlab.gatewayApi.internal.class.name" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 }}
    {{- include "gitlab.commonLabels" . | nindent 4 }}
    {{- include "gitlab.serviceLabels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.gatewayApiResources.internalGateway.class.controllerName }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ include "gitlab.gatewayApi.envoy.internal.config.name" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
