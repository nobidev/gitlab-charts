{{- if and .Values.global.gatewayApi.enabled .Values.global.gatewayApi.installEnvoy }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ include "gitlab.gatewayApi.class" . }}
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 }}
    {{- include "gitlab.commonLabels" . | nindent 4 }}
    {{- include "gitlab.serviceLabels" . | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gitlab-gatewayclass-controller
{{- end }}