{{- $aiGatewayValues := index .Values "ai-gateway" -}}
{{- if dig "externalAccess" "enabled" false $aiGatewayValues -}}
{{- if .Values.global.gatewayApi.enabled -}}
{{- $hostname := include "ai-gateway.hostname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "fullname" . }}-ai-gateway
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gitlab.standardLabels" $ | nindent 4 }}
    {{- include "gitlab.commonLabels" $ | nindent 4 }}
spec:
  parentRefs:
  {{- include "gitlab.gatewayApi.gatewayRef" . | nindent 4 }}
  hostnames:
    - {{ $hostname | quote }}
  rules:
  - backendRefs:
    - kind: Service
      name: {{ template "gitlab.aiGateway.serviceName" . }}
      port: 443
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
    {{/* gRPC connections are long-lived. */}}
    timeouts:
      request: 0s
{{- end }}
{{- end }}
