
{{- if .Values.global.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "gitlab.gatewayApi.gateway" . }}
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 }}
    {{- include "gitlab.commonLabels" . | nindent 4 }}
  annotations:
    {{- include "gitlab.gatewayApi.certmanager.annotations" . | nindent 4 }}
spec:
  gatewayClassName: {{ include "gitlab.gatewayApi.class" . | quote }}
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  - name: gitlab-https
    protocol: HTTPS
    port: 443
    hostname: {{ include "gitlab.gitlab.hostname" . | quote }}
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
        - name: gitlab-tls
  - name: gitlab-ssh
    protocol: TCP
    port: 22
    allowedRoutes:
      namespaces:
        from: Same
{{- end }}