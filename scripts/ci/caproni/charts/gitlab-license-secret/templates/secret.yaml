{{- /*
  .Values.license comes from caproni.yaml's dynamic_overrides on this deployer, which
  expands ${QA_EE_ACTIVATION_CODE} from the caproni process's own environment - not
  from a values file, so the activation code never touches scripts/ci/caproni/.values/,
  which the job uploads as an artifact. Matches how the k3d path's
  `kubectl create secret --from-literal=license=...` never writes it to a file either.

  Renders nothing when the variable is unset (forks, or any run with no license
  configured), so no deployer creates a Secret the `gitlab` deployer's values would
  otherwise point at - see the matching branch in caproni_merge_values.
*/}}
{{- if .Values.license }}
apiVersion: v1
kind: Secret
metadata:
  # Hardcoded rather than ${GITLAB_RELEASE_NAME}-gitlab-license: GITLAB_RELEASE_NAME_OVERRIDE
  # is pinned to "gitlab" everywhere in this environment (see caproni.yaml and
  # caproni_deploy.sh), so this must always match "gitlab-gitlab-license".
  name: gitlab-gitlab-license
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  license: {{ .Values.license | quote }}
{{- end }}
