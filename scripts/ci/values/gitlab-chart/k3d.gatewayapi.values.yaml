# Envoy Gateway (Gateway API) overrides for k3d per-job review environments.
# Replaces k3d.ingress.values.yaml — uses HTTPRoute/TCPRoute instead of NGINX Ingress.
# Unlike master, the 18.11 chart defaults global.gatewayApi.enabled/installEnvoy to
# false, so they are set explicitly here (CI values only — no chart change).
# nginx-ingress:
#   enabled: false

global:
  hosts:
    https: false
  ingress:
    # enabled: false
    configureCertmanager: false
  gatewayApi:
    enabled: true
    installEnvoy: true
    configureCertmanager: false

gatewayApiResources:
  gateway:
    protocol: HTTP
  # Gateway-wide ClientTrafficPolicy: keeps %2F in URL paths unchanged so that
  # GitLab API calls using namespace/project notation (root%2Fproject) are routed
  # correctly. In HTTP-only mode all listeners share port 80, so Envoy Gateway
  # rejects section-scoped CTPs (port overlap); only a gateway-wide CTP takes effect.
  envoy:
    clientTrafficPolicySpec:
      path:
        escapedSlashesAction: KeepUnchanged
