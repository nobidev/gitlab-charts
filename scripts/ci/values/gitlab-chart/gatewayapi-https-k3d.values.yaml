# Envoy Gateway (Gateway API) overrides for HTTPS k3d per-job review environments.
# Unlike gatewayapi-https.values.yaml (GKE review apps, pre-provisioned wildcard
# cert), certificates here are ACME-issued at deploy time by the bundled
# cert-manager against the in-cluster Pebble test server, configured in
# pebble-k3d.values.yaml.
# Requires DEPLOY_PEBBLE=true so the Pebble resources exist before `helm upgrade`.
global:
  ingress:
    configureCertmanager: false
  gatewayApi:
    # The managed Gateway gets the cert-manager issuer annotation and an
    # http-default :80 listener for HTTP-01 challenges; cert-manager's
    # gateway-shim creates the gitlab-tls, registry-tls and kas-tls
    # Certificates from the listener certificateRefs (chart defaults).
    configureCertmanager: true
