# Ingress overrides for k3d per-job review environments.
# Uses HTTP only (no TLS) so spec runners don't need cert trust configuration.
# The NGINX ingress controller is deployed by the GitLab chart itself;
# k3d's default Traefik is disabled at cluster creation time.
nginx-ingress:
  enabled: true

global:
  hosts:
    https: false
  ingress:
    enabled: true
    configureCertmanager: false
    annotations: {}
    tls:
      enabled: false
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false
    httpToHttpsRedirect: false
