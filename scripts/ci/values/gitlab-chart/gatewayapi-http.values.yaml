# Envoy Gateway (Gateway API) overrides for HTTP-only deployments (e.g. k3d per-job review environments).
# Replaces ingress-http.values.yaml — uses HTTPRoute/TCPRoute instead of NGINX Ingress.
# Values commented out below are now master defaults; left here to document intent
# and to test that the defaults are correctly applied.
# nginx-ingress:
#   enabled: false

global:
  hosts:
    https: false
  ingress:
    # enabled: false
    configureCertmanager: false
  gatewayApi:
    # enabled: true
    # installEnvoy: true
    configureCertmanager: false

gatewayApiResources:
  gateway:
    protocol: HTTP
  # Gateway-wide ClientTrafficPolicy: keeps %2F in URL paths unchanged so that
  # GitLab API calls using namespace/project notation (root%2Fproject) are routed
  # correctly, and strips the trailing dot from Host headers so absolute FQDNs
  # (`host.`) match the route hostnames (NGINX parity, exercised by
  # spec/features/gateway_host_normalization_spec.rb). In HTTP-only mode all
  # listeners share port 80, so Envoy Gateway rejects section-scoped CTPs
  # (port overlap); only a gateway-wide CTP takes effect.
  envoy:
    clientTrafficPolicySpec:
      path:
        escapedSlashesAction: KeepUnchanged
      headers:
        host:
          stripTrailingHostDot: true
