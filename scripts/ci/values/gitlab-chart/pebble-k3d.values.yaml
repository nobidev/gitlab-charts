# HTTPS with certificates ACME-issued at deploy time by the bundled cert-manager
# against the in-cluster Pebble test server (scripts/ci/lib/pebble.sh), for k3d
# per-job review environments. Passed by scripts/ci/autodevops.sh when Pebble is
# deployed, after the *-https-k3d networking values.
installCertmanager: true

global:
  hosts:
    https: true
  # GitLab pods must trust the Pebble-issued certificates when connecting to
  # the instance's own external URL from inside the cluster.
  certificates:
    customCAs:
      - secret: pebble-issuing-ca

certmanager-issuer:
  email: gitlab-charts-ci@example.com
  # In-cluster Pebble ACME directory instead of Let's Encrypt production
  # (jupyterhub/pebble-helm-chart serves ACME on service port 443).
  server: "https://pebble.${KUBE_NAMESPACE}.svc.cluster.local/dir"

certmanager:
  # Trust Pebble's ACME API TLS certificate: the pebble-helm-chart signs it
  # from a static root shipped in its own ConfigMap (only the cert is
  # mounted, not the root key stored alongside it). SSL_CERT_FILE replaces
  # the Go system roots for the controller only; Kubernetes API trust is
  # unaffected (in-cluster CA).
  extraEnv:
    - name: SSL_CERT_FILE
      value: /etc/pebble-api-ca/root-cert.pem
  volumes:
    - name: pebble-api-ca
      configMap:
        name: pebble
        items:
          - key: root-cert.pem
            path: root-cert.pem
  volumeMounts:
    - name: pebble-api-ca
      mountPath: /etc/pebble-api-ca
      readOnly: true

# The runner registers against the external https URL; the secret key
# <gitlab-hostname>.crt holds the Pebble issuing root (see pebble.sh).
gitlab-runner:
  certsSecretName: pebble-issuing-ca
