[settings]
legacy_version_file = false

# Disable sending anonymous download statistics to mise-versions.jdx.dev.
use_versions_host_track = false

# Install Ruby from precompiled binaries instead of compiling from source.
# Source builds (ruby-build) are slow and fail on the CI images (OpenSSL build failure).
# Precompiled becomes mise's default in 2026.8.0; this opts in early.
ruby.compile = false

[tools]
# Please continue to use `.tool-versions` to specify tool versions, rather than adding them directly here.

[plugins]
# Use this section to configure the source of any custom mise/asdf plugin
