{{- if and .Values.enabled .Values.global.gatewayApi.enabled .Values.global.gatewayApi.installEnvoy .Values.global.hosts.https }}
{{/*
ClientTrafficPolicy targeting the main Rails listener (gitlab-web).
Keeps paths with escaped slashes unchanged, as they are commonly used
in GitLab API calls to identify projects.
Only rendered in HTTPS mode: in HTTP-only deployments all listeners share port 80,
so section-scoped CTPs are rejected by Envoy Gateway (port overlap). The gateway-wide
CTP (gatewayApiResources.envoy.clientTrafficPolicySpec) covers this case instead.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ template "fullname" . }}-ctp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 }}
    {{- include "gitlab.commonLabels" . | nindent 4 }}
spec:
  targetRefs:
  {{- $ref := (include "gitlab.gatewayApi.gatewayRef" . | fromYamlArray) }}
  {{- $_ := unset (first $ref) "namespace" }}
  {{- $ref | toYaml | nindent 2 }}
  path:
    escapedSlashesAction: KeepUnchanged
{{- end }}
