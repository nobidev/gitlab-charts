{{- if and .Values.global.kas.enabled .Values.global.workspaces.enabled -}}
{{- $annotations := include "gitlab.serviceAnnotations" . | fromYaml -}}
{{- if eq .Values.global.ingress.provider "traefik" -}}
{{-   $annotations = merge (dict "traefik.ingress.kubernetes.io/service.serversscheme" "http") $annotations -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "kas.workspaces.serviceName" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 }}
    {{- include "gitlab.commonLabels" . | nindent 4 }}
    {{- include "gitlab.serviceLabels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  {{- if .Values.service.trafficDistribution }}
  trafficDistribution: {{ .Values.service.trafficDistribution | quote }}
  {{- end }}
  ports:
    - port: {{ .Values.service.workspacesServerPort }}
      targetPort: {{ .Values.service.workspacesServerPort }}
      protocol: TCP
      name: tcp-{{ template "name" . }}-workspaces-server
  selector:
    {{- include "kas.podSelectorLabels" . | nindent 4 }}
{{- end -}}
