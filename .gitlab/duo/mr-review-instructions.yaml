instructions:
  - name: Values Schema Kept in Sync
    fileFilters:
      - "charts/**/values.yaml"
      - "values.yaml"
    instructions: |
      1. If a new entry was added to this `values.yaml`, or an existing entry was
         modified, check whether the sibling `values.schema.json` in the same chart
         was updated to match, with type validation for the entry.
      2. If `values.schema.json` was not updated, ask the author to update it, or to
         explain why the schema doesn't need a change.
      See: doc/development/validation.md.

  - name: Statefulset Immutable Fields
    fileFilters:
      - "charts/**/templates/**/statefulset*.yaml"
      - "charts/**/templates/**/*statefulset*.yaml"
    instructions: |
      Only the `replicas`, `template`, and `updateStrategy` fields of a Kubernetes
      StatefulSet spec can be changed after creation; any other spec field change
      breaks `helm upgrade` for existing installs. Check whether this change modifies
      any StatefulSet spec field other than those three, and flag it if so.
      See: doc/development/validation.md.

  - name: Helm Template Style Guide
    fileFilters:
      - "charts/**/templates/**/*.tpl"
      - "charts/**/templates/**/*.yaml"
      - "charts/**/templates/**/*.yml"
      - "templates/**/*.tpl"
      - "templates/**/*.yaml"
    instructions: |
      1. New template/property names should use camelCase (e.g. `assembleHost`), not
         kebab-case or PascalCase.
      2. Prefer `nindent` over `indent` for readability.
      3. When accessing nested `.Values` paths that may not fully exist, prefer safe
         access (`dig`, `index`, or parenthesized navigation) over direct chained
         access like `.Values.foo.bar.baz`, unless the full path is guaranteed to
         exist.
      4. Question broad use of `toYaml` on user-supplied config blocks without a
         documented reason; prefer exposing specific, minimal override keys unless a
         fully flexible passthrough is clearly needed.
      5. For content rendered into Secrets or ConfigMaps via ERB/gomplate that may
         contain sensitive, user-supplied strings (passwords, tokens), check that
         values are encoded with a format-native encoder (e.g. `.to_json` in ERB,
         `data.ToJSON` in gomplate) rather than being wrapped in raw quotes.
      See: doc/development/style_guide.md.

  - name: Deprecations, Removals, and Config Checks
    fileFilters:
      - "templates/_removals.tpl"
      - "templates/_checkConfig.tpl"
      - "templates/NOTES.txt"
      - "charts/**/templates/NOTES.txt"
    instructions: |
      1. New deprecation/removal templates should follow the `gitlab.removal.*`
         naming convention and be added under the `add templates here` marker in
         the `gitlab.removals` template (`templates/_removals.tpl`). New
         problematic-configuration checks should follow `gitlab.checkConfig.*` and
         be added under the same marker in the `gitlab.checkConfig` template
         (`templates/_checkConfig.tpl`).
      2. Deprecation, removal, and checkConfig messages should identify the
         affected chart (relative to the global chart, e.g. `gitlab.webservice`)
         and name the property relative to that chart, plus the action the user
         should take.
      3. The `if` guarding a message should not trim the trailing newline (`}}`,
         not `-}}`), so the rendered output stays readable.
      4. checkConfig messages should not use hard line breaks to wrap paragraphs,
         since the message may interpolate configuration values that would break
         the hard wrapping.
      5. Detection logic should not assume intermediate keys exist; check for use
         of `hasKey` / `empty` / safe navigation before accessing nested
         properties.
      6. If a new checkConfig check was added, check whether
         `spec/integration/check_config_spec.rb` was updated to cover it.
      See: doc/development/deprecations.md, doc/development/checkconfig.md.

  - name: Changelog Entry for User-Facing Changes
    instructions: |
      If this MR contains a user-facing change (a change to behavior, defaults, or
      configuration that operators or chart users would notice), check whether any
      commit in the MR includes a `Changelog:` git trailer (one of added, fixed,
      changed, deprecated, removed, security, performance, other).

      ONLY IF the change looks user-facing and no commit has a `Changelog:` trailer,
      ask the author: "This looks like a user-facing change. Could you add a
      `Changelog:` trailer to the relevant commit? See doc/development/changelog.md
      for the workflow and accepted values."

      Per doc/development/changelog.md, do not ask for a changelog entry for changes
      that are purely developer-facing, such as refactoring, technical debt
      remediation, or test suite changes.

  - name: MR Author Checklist for Runtime Changes
    fileFilters:
      - "charts/**/templates/**/*"
      - "templates/**/*"
      - "charts/**/values.yaml"
      - "values.yaml"
    instructions: |
      This MR changes chart runtime behavior (templates or default values). The MR
      author checklist includes:
      - "Documentation created/updated."
      - "Tests added/updated."
      - "Have you validated that your change works end-to-end on a real cluster
        deployment? - Describe how you did it in a comment."
      It also states: "For anything in this list which will not be completed,
      please provide a reason in the MR discussion."

      1. If this MR adds or changes a user-facing `values.yaml` option or behavior,
         check whether `doc/` was updated to describe it. If missing and no reason
         was given in the MR discussion, ask the author to confirm the
         "Documentation created/updated" checklist item or provide a reason.
      2. If this MR changes template logic, check whether a corresponding RSpec
         spec under `spec/` was added or updated. If missing and no reason was
         given, ask the author to confirm the "Tests added/updated" checklist item
         or provide a reason.
      3. Check the MR description and comments for confirmation of end-to-end
         validation on a real cluster deployment. ONLY IF this confirmation could
         not be reliably located, `create_merge_request_note` with this message
         verbatim:

         Ask the author:
         "I couldn't find a description of end-to-end validation for this change.

         Before requesting a review, please confirm you've validated this change
         end-to-end on a real cluster deployment and describe how in a comment,
         then check off the corresponding item in the MR checklist. See
         https://docs.gitlab.com/charts/development/environment_setup/
         if you need to set up a local development cluster.

         This MR affects chart runtime behavior - skipping end-to-end validation
         risks shipping a broken deployment."

  - name: RSpec Test Practices
    fileFilters:
      - "spec/**/*.rb"
    instructions: |
      1. Flag a `:focus` tag (e.g. `it 'x', :focus => true do`) left on a `describe`,
         `context`, or `it` block: with this tag present, only tagged tests run,
         so it should not be committed.
      2. If a test sets a value to `{}` to represent removing or clearing a key,
         flag it: an empty hash produces no change when merged, whereas Helm's
         `coalesceValues` (unlike Ruby's `deep_merge`) removes the key only when it
         is set to `null`. Use `null` to represent key removal in test values.
      3. Flag use of the imperative `merge!` unless a comment explains why it's
         needed.
      4. If a new test requires a real Kubernetes cluster, check that it is placed
         in `spec/features` rather than alongside `helm template`-only specs.
      5. If several new `it` blocks each make a single assertion against the same
         `HelmTemplate` instance, suggest consolidating them into one `it` with
         multiple `expect` calls, since each `it` block re-runs an expensive `helm
         template` invocation.
      See: doc/development/rspec.md.

  - name: Downstream Impact on GitLab Operator
    fileFilters:
      - "values.yaml"
      - "charts/**/values.yaml"
      - "**/values.schema.json"
    instructions: |
      The MR reviewers checklist includes: "Consider downstream impact to the
      Operator, as per evaluating impact from changes to GitLab chart
      (https://docs.gitlab.com/operator/developer/charts_dependency)." Since this MR
      changes `values.yaml` or `values.schema.json`, remind the reviewer of this
      checklist item.
