# Caproni-based review environment, running alongside the k3d jobs in
# .gitlab/ci/k3d-templates.gitlab-ci.yml. Nothing is removed; retiring the k3d jobs is
# a follow-up once this path has soaked. See gitlab-org/charts/gitlab#6505.
#
# Caproni (https://gitlab.com/gitlab-org/caproni) is the deployment interface for
# GitLab cloud-native development, so exercising it here means a chart change that
# breaks `caproni up` fails in this pipeline rather than in a developer's terminal.
#
# These jobs live in the PARENT pipeline, unlike the k3d ones. The k3d child-pipeline
# layer exists to fan out over K3D_K8S_IMAGE with a per-version Allure report; there
# is only one k3s version here so far, so it would buy nothing. Two consequences:
#
#   * .gitlab-ci.yml only includes this file when LIMIT_TO is empty, which is never
#     true inside a child pipeline. The recursion guard is therefore structural; the
#     parent_pipeline rule below is defence in depth.
#   * pin_image_versions runs only in the parent, so `needs` is a plain same-pipeline
#     reference rather than the cross-pipeline form the k3d jobs use.
#
# When a K8s version matrix is added, promote this to a `caproni` bridge plus a
# LIMIT_TO: caproni_version child, mirroring the k3d pair. These templates carry over.

.caproni_base:
  extends:
    # .specs supplies the builder image (ruby, bundler, chrome) and .dind.
    - .specs
  interruptible: true
  # Same runners as .k3d_base: provisioned for Docker-in-Docker plus k3d, and the
  # baseline these jobs are meant to be compared against.
  tags:
    - e2e
  variables:
    # Matches the v4.0.0 pin in gitlab-org/gitlab-caproni's .mise.toml. The generic
    # package path has no leading `v`.
    CAPRONI_VERSION: "4.0.0"
    YQ_VERSION: "4.53.3"                          # matches mise.toml
    CAPRONI_DIR: "scripts/ci/caproni"
    # The primary row of the k3d matrix.
    K3D_K8S_IMAGE: "rancher/k3s:v1.36.2-k3s1"
    # Both the GitLab and gitlab-dev-stack releases land here, so the dev-stack
    # *-conn Secrets are found by bare name. Unlike the k3d jobs, which use `default`.
    KUBE_NAMESPACE: "gitlab"
    NAMESPACE: "${KUBE_NAMESPACE}"
    # Must equal release.name in scripts/ci/caproni/caproni.yaml. Without it,
    # gitlab_release_name() computes rvw-${CI_PIPELINE_ID}-gitlab and every
    # `-lrelease=` selector in scripts/ci/autodevops.sh matches nothing.
    GITLAB_RELEASE_NAME_OVERRIDE: "gitlab"
    # Per-job cluster, so gitlab.<ip>.nip.io is already unique and the chart's
    # hostnames line up with cluster.network.hostname in caproni.yaml.
    HOST_SUFFIX: ""
    VARIABLES_FILE: "variables/caproni_deploy"
    # The cluster really is k3d, so is_k3d_deployment() is honest here: it gives
    # external_protocol() => http and short-circuits set_context().
    K3D_MODE: "true"
    # --insecure-registry is what lets `docker login`/`push` reach the in-cluster
    # registry over HTTP on a nip.io host, which resolves into this range. Set on the
    # daemon's entrypoint by .dind, so it cannot be added later.
    DOCKER_OPTIONS: "--registry-mirror ${DOCKER_MIRROR} --insecure-registry 172.16.0.0/12"
    # Cosmetic in the parent pipeline (the literal is only required inside child
    # pipelines, per the comment in .k3d_base), but kept for symmetry with the k3d
    # jobs and because release.chart resolves ${CI_PROJECT_DIR}.
    GIT_CLONE_PATH: /builds/gitlab
    # Written by scripts/ci/caproni_deploy.sh for the bare-kubectl call sites.
    KUBECONFIG: /tmp/caproni-kubeconfig.yaml
  before_script:
    - source scripts/ci/autodevops.sh
    - source scripts/ci/k3d.sh
    - source scripts/ci/lib/caproni.sh
    # k3d_install (toolchain) plus yq and the pinned caproni binary.
    - caproni_install
  after_script:
    - export KUBECONFIG=/tmp/caproni-kubeconfig.yaml
    - source scripts/ci/autodevops.sh
    - source scripts/ci/k3d.sh
    - k3d_collect_debug
    # Equivalent to `caproni destroy`, without needing the config to load.
    - k3d cluster delete caproni || true
  rules:
    # Not yet validated on mirrors (e.g. security); canonical only, as .k3d_qa_template.
    - !reference [.rule:skip_if_fork]
    - if: '$PIPELINE_TYPE =~ /DOCS_PIPELINE/'
      when: never
    # Redundant given the include gate in .gitlab-ci.yml, kept as defence in depth.
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: never
    # Manual and non-blocking for the first iteration: this runs in addition to the
    # k3d jobs, so it must not gate anything while it is still being proven.
    - if: '$PIPELINE_TYPE =~ /DEFAULT_BRANCH_PIPELINE$/'
      when: manual
      allow_failure: true
    - if: '$PIPELINE_TYPE =~ /MR_PIPELINE$/'
      when: manual
      allow_failure: true
    - if: '$PIPELINE_TYPE =~ /STABLE_BRANCH_PIPELINE$/'
      when: manual
      allow_failure: true
    - if: '$PIPELINE_TYPE =~ /FEATURE_BRANCH_PIPELINE$/'
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 7d
    paths:
      - ./k3d-debug/
      # The exact merged values file handed to helm, for diffing against the k3d run.
      - ./scripts/ci/caproni/.values/
      - ./variables
      # Restores what .specs collects; overriding artifacts drops its paths.
      - tmp/capybara

# The chart's cluster-dependent RSpec specs: backups, runner registration, and
# gateway host normalization. The Caproni counterpart of review_specs_k3d.
review_specs_caproni:
  extends: .caproni_base
  stage: review-specs
  needs:
    - pin_image_versions
  variables:
    RSPEC_TAGS: type:feature
  script:
    - ./scripts/ci/install_spec_dependencies.sh
    - ./scripts/ci/caproni_deploy.sh
    # spec/spec_helper.rb excludes every type:feature spec when bare kubectl cannot
    # reach the cluster, and rspec then exits 0 having run nothing. Repeat its exact
    # probe, in the environment the rspec process inherits, so that a green job means
    # the specs ran.
    - source "${VARIABLES_FILE}" && kubectl --request-timeout 1s get nodes
    - ./scripts/ci/run_specs.sh

# The Caproni counterpart of qa_k3d. No `parallel:` yet, so this iteration stands up
# two clusters per pipeline rather than six.
#
# Deliberately a separate job from review_specs_caproni rather than sharing one
# cluster: it keeps failure attribution clean, and backups_spec.rb scales Rails down,
# restores the database and scales back up, which would destroy an interleaved QA
# run's fixtures.
qa_caproni:
  extends: .caproni_base
  stage: qa
  needs:
    - pin_image_versions
  variables:
    TEST_SUITE: $QA_SANITY_SUITE_OPTIONS
    QA_ARTIFACTS_DIR: $CI_PROJECT_DIR
    QA_CAN_TEST_PRAEFECT: "false"
    # No allure-report component instance exists in the parent pipeline; the k3d one
    # is declared in the child. Closes when this moves to a child pipeline.
    QA_GENERATE_ALLURE_REPORT: "false"
  script:
    - source scripts/ci/qa.sh
    - qa_export_passwords
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - gem install gitlab-qa -v "${GITLAB_QA_VERSION}"
    - ./scripts/ci/caproni_deploy.sh
    - source "${VARIABLES_FILE}"
    # GITLAB_QA_ADMIN_ACCESS_TOKEN is baked at job-setup time from the CI variable
    # GITLAB_ADMIN_TOKEN (which holds another instance's token). Re-export so
    # gitlab-qa picks up the PAT created against this instance.
    - export GITLAB_QA_ADMIN_ACCESS_TOKEN="${GITLAB_ADMIN_TOKEN}"
    # Proves the license activation and PAT minting in caproni_deploy.sh worked
    # before spending the suite's runtime on it.
    - |
      http_code=$(curl -sSo /dev/null -w "%{http_code}" \
        --header "PRIVATE-TOKEN: ${GITLAB_ADMIN_TOKEN}" \
        "${PROTOCOL:-http}://${GITLAB_URL}/api/v4/user")
      if [ "${http_code}" != "200" ]; then
        echo "Pre-flight check failed: GET /api/v4/user returned HTTP ${http_code} (expected 200)"
        exit 1
      fi
    - |
      if [ -n "$QA_GITLAB_VERSION" ]; then
        QA_IMAGE="registry.gitlab.com/gitlab-org/gitlab/gitlab-ee-qa:$QA_GITLAB_VERSION"
      elif [ -n "$QA_GITLAB_REVISION" ]; then
        QA_IMAGE="registry.gitlab.com/gitlab-org/gitlab/gitlab-ee-qa:$QA_GITLAB_REVISION"
      else
        QA_IMAGE="gitlab/gitlab-ee-qa:nightly"
      fi
    - echo "Running - 'gitlab-qa Test::Instance::Any --qa-image $QA_IMAGE EE ${PROTOCOL:-http}://$GITLAB_URL -- $TEST_SUITE'"
    - |
      SIGNUP_DISABLED=true \
      QA_DEBUG=true \
      GITLAB_USERNAME=root \
      GITLAB_PASSWORD=$ROOT_PASSWORD \
      GITLAB_ADMIN_USERNAME=root \
      GITLAB_ADMIN_PASSWORD=$ROOT_PASSWORD \
      gitlab-qa Test::Instance::Any --qa-image $QA_IMAGE EE ${PROTOCOL:-http}://$GITLAB_URL -- $TEST_SUITE
  retry: 1
  artifacts:
    when: always
    expire_in: 7d
    paths:
      - ./gitlab-qa-run-*
      - ./k3d-debug/
      - ./scripts/ci/caproni/.values/
      - ./variables
      - tmp/capybara
