# Child pipeline for the Caproni review environment.
# Triggered by the caproni bridge defined in .gitlab-ci.yml
# (LIMIT_TO=caproni_version). PARENT_PIPELINE_ID and PIPELINE_TYPE are passed
# explicitly by the bridge. DANGER_GITLAB_API_TOKEN and QA_ALLURE_* are CI/CD
# project variables available in all pipelines automatically.
# .caproni_base is provided by caproni-templates.gitlab-ci.yml,
# which .gitlab-ci.yml includes for LIMIT_TO=caproni_version.

# Both jobs share the "specs" stage so they start simultaneously.

review_specs_caproni:
  extends: .caproni_base
  stage: specs
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: pin_image_versions
  variables:
    RSPEC_TAGS: type:feature
  script:
    - ./scripts/ci/install_spec_dependencies.sh
    - ./scripts/ci/caproni_deploy.sh
    # spec/spec_helper.rb excludes every type:feature spec when bare kubectl cannot
    # reach the cluster, and rspec then exits 0 having run nothing. Repeat its exact
    # probe, in the environment the rspec process inherits, so that a green job means
    # the specs ran.
    - source "${VARIABLES_FILE}" && kubectl --request-timeout 1s get nodes
    - ./scripts/ci/run_specs.sh
  rules:
    - when: on_success

qa_caproni:
  extends: .caproni_base
  stage: specs
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: pin_image_versions
  variables:
    TEST_SUITE: $QA_SANITY_SUITE_OPTIONS
    QA_ARTIFACTS_DIR: $CI_PROJECT_DIR
    QA_CAN_TEST_PRAEFECT: "false"
    # Allure report support will be added in a later iteration, when this pipeline
    # has soaked for a while. The Allure component is a TODO separate from this
    # bridge/child restructuring.
    QA_GENERATE_ALLURE_REPORT: "false"
  script:
    - source scripts/ci/qa.sh
    - qa_export_passwords
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - gem install gitlab-qa -v "${GITLAB_QA_VERSION}"
    - ./scripts/ci/caproni_deploy.sh
    - source "${VARIABLES_FILE}"
    # GITLAB_QA_ADMIN_ACCESS_TOKEN is baked at job-setup time from the CI variable
    # GITLAB_ADMIN_TOKEN (which holds another instance's token). Re-export so
    # gitlab-qa picks up the PAT created against this instance.
    - export GITLAB_QA_ADMIN_ACCESS_TOKEN="${GITLAB_ADMIN_TOKEN}"
    # Proves the license activation and PAT minting in caproni_deploy.sh worked
    # before spending the suite's runtime on it.
    - |
      http_code=$(curl -sSo /dev/null -w "%{http_code}" \
        --header "PRIVATE-TOKEN: ${GITLAB_ADMIN_TOKEN}" \
        "${PROTOCOL:-http}://${GITLAB_URL}/api/v4/user")
      if [ "${http_code}" != "200" ]; then
        echo "Pre-flight check failed: GET /api/v4/user returned HTTP ${http_code} (expected 200)"
        exit 1
      fi
    - |
      if [ -n "$QA_GITLAB_VERSION" ]; then
        QA_IMAGE="registry.gitlab.com/gitlab-org/gitlab/gitlab-ee-qa:$QA_GITLAB_VERSION"
      elif [ -n "$QA_GITLAB_REVISION" ]; then
        QA_IMAGE="registry.gitlab.com/gitlab-org/gitlab/gitlab-ee-qa:$QA_GITLAB_REVISION"
      else
        QA_IMAGE="gitlab/gitlab-ee-qa:nightly"
      fi
    - echo "Running - 'gitlab-qa Test::Instance::Any --qa-image $QA_IMAGE EE ${PROTOCOL:-http}://$GITLAB_URL -- $TEST_SUITE'"
    - |
      SIGNUP_DISABLED=true \
      QA_DEBUG=true \
      GITLAB_USERNAME=root \
      GITLAB_PASSWORD=$ROOT_PASSWORD \
      GITLAB_ADMIN_USERNAME=root \
      GITLAB_ADMIN_PASSWORD=$ROOT_PASSWORD \
      gitlab-qa Test::Instance::Any --qa-image $QA_IMAGE EE ${PROTOCOL:-http}://$GITLAB_URL -- $TEST_SUITE
  retry: 1
  artifacts:
    when: always
    expire_in: 7d
    paths:
      - ./gitlab-qa-run-*
      - ./k3d-debug/
      - ./scripts/ci/caproni/.values/
      - ./variables
      - tmp/capybara
  rules:
    - when: on_success
