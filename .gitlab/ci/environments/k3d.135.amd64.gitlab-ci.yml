# PoC: k3d per-job review environment for Kubernetes v1.35 (amd64).
# Gated behind LIMIT_TO=k3d135; runs alongside existing vcluster jobs.
# See: https://gitlab.com/gitlab-org/charts/gitlab/-/issues/6421

.k3d135_base:
  extends: .k3d_base
  variables:
    K3D_K8S_IMAGE: "rancher/k3s:v1.35.3-k3s1"
    HOST_SUFFIX: "${CI_JOB_ID}"
    VARIABLES_FILE: "variables/review_specs_k3d_v135"

review_specs_k3d_v135:
  extends:
    - .k3d_review_specs_template
    - .k3d135_base
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: pin_image_versions

qa_k3d_v135:
  extends:
    - .k3d_qa_template
    - .k3d135_base
  parallel: $QA_PARALLEL
  variables:
    TEST_SUITE: $QA_SANITY_SUITE_OPTIONS
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: pin_image_versions
