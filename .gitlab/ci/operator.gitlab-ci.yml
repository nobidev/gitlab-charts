trigger_operator_test:
  stage: approve-review-apps
  trigger:
    project: 'gitlab-org/cloud-native/gitlab-operator'
    branch: master
  variables:
    TRIGGER_PROJECT: "${CI_PROJECT_PATH}"
    # Ref used by Operator to pull chart for unittests
    CHARTS_REF: "${CI_COMMIT_SHA}"
    # Ref used by Operator to pull scripts to provision Valkey, PostgreSQL, and Garage.
    CHART_CI_LIB_REF: "${CI_COMMIT_SHA}"
    # Branch context for Operator to decide whether to bump the chart version.
    CHARTS_BRANCH: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME$CI_COMMIT_BRANCH"
  inherit:
    variables:
      - CANONICAL_PROJECT_PATH
      - SECURITY_PROJECT_PATH
  allow_failure: true
  rules:
    - !reference [.rule:skip_docs_pipeline]
    - !reference [.rule:skip_if_not_canonical_or_security]
    - when: manual
