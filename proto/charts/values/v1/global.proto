syntax = "proto3";

package charts.values.v1;

import "gitlab/config/annotations.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

option go_package = "gitlab.com/gitlab-org/charts/gitlab/pkg/values/charts/values/v1;valuesv1";

// GlobalConfig models the entire `global:` block of the GitLab Helm chart
// values.yaml. These settings propagate to every sub-chart.
// https://docs.gitlab.com/charts/charts/globals
message GlobalConfig {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Common metadata (labels) applied broadly. Not used for selectors.
  GlobalCommon common = 1;

  // Container image defaults shared across supported charts.
  GlobalImage image = 2;

  // Supplemental pod labels. Not used for selectors.
  GlobalPod pod = 3;

  // GitLab edition to deploy.
  string edition = 4 [(buf.validate.field).string = {in: ["ce", "ee"]}];

  // Pin the GitLab version used for image tags.
  string gitlab_version = 5;

  // Application resource (CRD) settings.
  GlobalApplication application = 6;

  // Host / domain settings for the various GitLab endpoints.
  GlobalHosts hosts = 7;

  // Gateway API (Envoy) settings.
  GlobalGatewayApi gateway_api = 8;

  // Ingress settings (deprecated ingress-controller path).
  GlobalIngress ingress = 9;

  // Override the API version used for HorizontalPodAutoscaler.
  GlobalHpa hpa = 10;

  // Enable KEDA globally.
  GlobalKeda keda = 11;

  // Override the API version used for PodDisruptionBudget.
  GlobalPdb pdb = 12;

  // Override the API version used for CronJob.
  GlobalBatch batch = 13;

  // Override enablement of ServiceMonitor and PodMonitor objects.
  GlobalMonitoring monitoring = 14;

  // GitLab license secret reference.
  GlobalGitlab gitlab = 15;

  // Initial root password secret reference.
  GlobalSecretRef initial_root_password = 16;

  // PostgreSQL connection settings.
  GlobalPsql psql = 17;

  // Redis connection settings.
  GlobalRedis redis = 18;

  // Gitaly settings.
  GlobalGitaly gitaly = 19;

  // Praefect (Gitaly Cluster) settings.
  GlobalPraefect praefect = 20;

  // Shared Rails application configuration.
  GlobalAppConfig app_config = 21;

  // OAuth application settings.
  GlobalOauth oauth = 22;

  // GitLab Geo settings.
  GlobalGeo geo = 23;

  // Kubernetes Agent Server (KAS) settings.
  GlobalKas kas = 24;

  // Workspaces feature toggle.
  GlobalWorkspaces workspaces = 25;

  // GitLab Shell settings.
  GlobalShell shell = 26;

  // Rails secret reference.
  GlobalSecretRef rails_secrets = 27;

  // Generic Rails settings applicable to all Rails-based containers.
  GlobalRails rails = 28;

  // Container registry settings.
  GlobalRegistry registry = 29;

  // GitLab Pages settings.
  GlobalPages pages = 30;

  // GitLab Runner registration settings.
  GlobalRunner runner = 31;

  // Outgoing email (SMTP) server settings.
  GlobalSmtp smtp = 32;

  // Email persona settings used in outgoing email.
  GlobalEmail email = 33;

  // Timezone for containers.
  string time_zone = 34 [(gitlab.config.helm_name) = "time_zone"];

  // Global Service annotations and labels.
  GlobalService service = 35;

  // Global Deployment annotations.
  GlobalDeployment deployment = 36;

  // revisionHistoryLimit for all StatefulSets and Deployments.
  uint32 revision_history_limit = 37;

  // Global nodeAffinity (currently only honored by the registry chart).
  google.protobuf.Struct node_affinity = 38;

  // Anti-affinity mode for pods.
  string anti_affinity = 39 [(buf.validate.field).string = {in: ["hard", "soft"]}];

  // Affinity rules (freeform passthrough).
  google.protobuf.Struct affinity = 40;

  // Priority class assigned to pods.
  string priority_class_name = 41;

  // Workhorse settings.
  GlobalWorkhorse workhorse = 42;

  // Webservice settings.
  GlobalWebservice webservice = 43;

  // Custom certificate authority injection settings.
  GlobalCertificates certificates = 44;

  // kubectl image used by hooks.
  GlobalKubectl kubectl = 45;

  // gitlab-base image settings.
  GlobalGitlabBase gitlab_base = 46;

  // ServiceAccount settings.
  GlobalServiceAccount service_account = 47;

  // Tracing settings.
  GlobalTracing tracing = 48;

  // Zoekt (code search) settings.
  GlobalZoekt zoekt = 49;

  // OpenBao (experimental secrets backend) settings.
  GlobalOpenbao openbao = 50;

  // Extra environment variables injected into containers (freeform).
  google.protobuf.Struct extra_env = 51;

  // Extra environment variables sourced from other objects (freeform).
  google.protobuf.Struct extra_env_from = 52;

  // Job settings.
  GlobalJob job = 53;

  // Traefik (deprecated ingress) settings.
  GlobalTraefik traefik = 54;
}

// GlobalSecretRef is a reusable reference to a Kubernetes Secret key.
message GlobalSecretRef {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Name of the Kubernetes Secret.
  string secret = 1;

  // Key within the Secret.
  string key = 2;
}

// GlobalImageConfig is a reusable container image definition.
message GlobalImageConfig {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Image repository.
  string repository = 1;

  // Image tag.
  string tag = 2;

  // Image pull policy.
  string pull_policy = 3;

  // Image pull secrets (freeform list).
  repeated google.protobuf.Struct pull_secrets = 4;
}

// GlobalHostPort is a reusable host/port pair.
message GlobalHostPort {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Hostname.
  string host = 1;

  // Port.
  uint32 port = 2;
}

// GlobalCommon holds common metadata applied broadly.
message GlobalCommon {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Supplemental labels (freeform).
  google.protobuf.Struct labels = 1;
}

// GlobalImage holds the global container image defaults.
message GlobalImage {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Registry host override.
  string registry = 1;

  // Image pull policy.
  string pull_policy = 2;

  // Image pull secrets (freeform list).
  repeated google.protobuf.Struct pull_secrets = 3;

  // Suffix appended to image tags.
  string tag_suffix = 4;
}

// GlobalPod holds supplemental pod labels.
message GlobalPod {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Supplemental pod labels (freeform).
  google.protobuf.Struct labels = 1;
}

// GlobalApplication configures the Application CRD resource.
message GlobalApplication {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Whether to create the Application resource.
  bool create = 1;

  // Application links (freeform list).
  repeated google.protobuf.Struct links = 2;

  // Whether to allow cluster roles.
  bool allow_cluster_roles = 3;
}

// GlobalHosts configures hostnames for the various GitLab endpoints.
message GlobalHosts {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Base domain.
  string domain = 1;

  // Suffix appended to hostnames.
  string host_suffix = 2;

  // Whether to use HTTPS.
  bool https = 3;

  // External IP for services.
  string external_ip = 4 [(gitlab.config.helm_name) = "externalIP"];

  // SSH host.
  string ssh = 5;

  // Per-endpoint host overrides (freeform).
  google.protobuf.Struct gitlab = 6;

  // Registry host overrides (freeform).
  google.protobuf.Struct registry = 7;

  // TLS host overrides (freeform).
  google.protobuf.Struct tls = 8;

  // Smartcard host overrides (freeform).
  google.protobuf.Struct smartcard = 9;

  // KAS host overrides (freeform).
  google.protobuf.Struct kas = 10;

  // Pages host overrides (freeform).
  google.protobuf.Struct pages = 11;

  // OpenBao host overrides (freeform).
  google.protobuf.Struct openbao = 12;

  // Workspaces host overrides (freeform).
  google.protobuf.Struct workspaces = 13;
}

// GlobalGatewayApi configures the Gateway API (Envoy) integration.
message GlobalGatewayApi {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Whether Gateway API is enabled.
  bool enabled = 1;

  // Reference to an existing Gateway.
  GlobalGatewayRef gateway_ref = 2;

  // Whether to install the bundled Envoy Gateway.
  bool install_envoy = 3;

  // Whether to configure cert-manager for the Gateway.
  bool configure_certmanager = 4;

  // Whether to redirect HTTP to HTTPS.
  bool http_to_https_redirect = 5;
}

// GlobalGatewayRef references an existing Gateway resource.
message GlobalGatewayRef {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Gateway name.
  string name = 1;

  // Gateway namespace.
  string namespace = 2;
}

// GlobalIngress configures the deprecated ingress-controller path.
message GlobalIngress {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Ingress API version override.
  string api_version = 1;

  // Whether to configure cert-manager.
  bool configure_certmanager = 2;

  // Whether to use the new ingress for certificates.
  bool use_new_ingress_for_certs = 3;

  // Ingress provider.
  string provider = 4;

  // Ingress class.
  string class = 5;

  // Ingress annotations (freeform).
  google.protobuf.Struct annotations = 6;

  // Whether ingress is enabled.
  bool enabled = 7;

  // TLS settings (freeform).
  google.protobuf.Struct tls = 8;

  // Ingress path.
  string path = 9;

  // Ingress path type.
  string path_type = 10;
}

// GlobalHpa overrides the HorizontalPodAutoscaler API version.
message GlobalHpa {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // API version override.
  string api_version = 1;
}

// GlobalKeda toggles KEDA globally.
message GlobalKeda {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Whether KEDA is enabled.
  bool enabled = 1;
}

// GlobalPdb overrides the PodDisruptionBudget API version.
message GlobalPdb {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // API version override.
  string api_version = 1;
}

// GlobalBatch overrides the CronJob API version.
message GlobalBatch {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // CronJob API version settings.
  GlobalBatchCronJob cron_job = 1;
}

// GlobalBatchCronJob overrides the CronJob API version.
message GlobalBatchCronJob {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // API version override.
  string api_version = 1;
}

// GlobalMonitoring toggles ServiceMonitor/PodMonitor objects.
message GlobalMonitoring {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Whether monitoring objects are enabled.
  bool enabled = 1;
}

// GlobalGitlab holds the GitLab enterprise license reference.
message GlobalGitlab {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Enterprise license secret reference.
  GlobalSecretRef license = 1;
}

// GlobalPsql configures PostgreSQL connectivity.
message GlobalPsql {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Known database decompositions (supports template handling).
  repeated string known_decompositions = 1;

  // Connection timeout in seconds.
  uint32 connect_timeout = 2;

  // TCP keepalives toggle (0/1).
  uint32 keepalives = 3;

  // TCP keepalives idle time.
  uint32 keepalives_idle = 4;

  // TCP keepalives interval.
  uint32 keepalives_interval = 5;

  // TCP keepalives count.
  uint32 keepalives_count = 6;

  // TCP user timeout.
  uint32 tcp_user_timeout = 7;

  // PostgreSQL password settings.
  GlobalPsqlPassword password = 8;

  // Database host.
  string host = 9;

  // Database port.
  uint32 port = 10 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];

  // Database username.
  string username = 11;

  // Database name.
  string database = 12;

  // Application name reported to PostgreSQL.
  string application_name = 13;

  // Whether prepared statements are enabled.
  bool prepared_statements = 14;

  // Whether database (rake) tasks are enabled.
  bool database_tasks = 15;

  // Main decomposition overrides.
  GlobalPsqlConnection main = 16;

  // CI decomposition overrides.
  GlobalPsqlConnection ci = 17;
}

// GlobalPsqlPassword configures how the PostgreSQL password is sourced.
message GlobalPsqlPassword {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Whether to read the password from a Secret.
  bool use_secret = 1;

  // Secret name.
  string secret = 2;

  // Secret key.
  string key = 3;

  // File path to read the password from.
  string file = 4;
}

// GlobalPsqlConnection holds per-decomposition connection overrides.
message GlobalPsqlConnection {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Database host.
  string host = 1;

  // Database port.
  uint32 port = 2 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];

  // Database username.
  string username = 3;

  // Database name.
  string database = 4;

  // Application name reported to PostgreSQL.
  string application_name = 5;

  // Whether prepared statements are enabled.
  bool prepared_statements = 6;

  // Whether database (rake) tasks are enabled.
  bool database_tasks = 7;
}

// GlobalRedis configures Redis connectivity.
message GlobalRedis {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Redis auth settings.
  GlobalRedisAuth auth = 1;

  // Connection timeout.
  uint32 connect_timeout = 2;

  // Read timeout.
  uint32 read_timeout = 3;

  // Write timeout.
  uint32 write_timeout = 4;

  // Redis host.
  string host = 5;

  // Redis port.
  uint32 port = 6 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];

  // Redis database index.
  uint32 database = 7;

  // Redis user.
  string user = 8;

  // Sentinel endpoints.
  repeated GlobalRedisSentinel sentinels = 9;

  // Redis sentinel auth settings.
  GlobalRedisAuth sentinel_auth = 10;
}

// GlobalRedisAuth configures Redis authentication.
message GlobalRedisAuth {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Whether auth is enabled.
  bool enabled = 1;

  // Secret name.
  string secret = 2;

  // Secret key.
  string key = 3;
}

// GlobalRedisSentinel is a Redis Sentinel endpoint.
message GlobalRedisSentinel {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Sentinel host.
  string host = 1;

  // Sentinel port.
  uint32 port = 2 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];
}

// GlobalGitaly configures Gitaly.
message GlobalGitaly {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Whether Gitaly is enabled.
  bool enabled = 1;

  // Gitaly auth token secret reference.
  GlobalSecretRef auth_token = 2;

  // Service name override.
  string service_name = 3;

  // Internal Gitaly nodes.
  GlobalGitalyInternal internal = 4;

  // External Gitaly nodes (freeform list).
  repeated google.protobuf.Struct external = 5;

  // Gitaly Service settings.
  GlobalGitalyService service = 6;

  // Gitaly TLS settings.
  GlobalGitalyTls tls = 7;

  // Gitaly client settings.
  GlobalGitalyClient client = 8;
}

// GlobalGitalyInternal lists the internal Gitaly storage names.
message GlobalGitalyInternal {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Internal storage names.
  repeated string names = 1;
}

// GlobalGitalyService configures the Gitaly (or Praefect) Service.
message GlobalGitalyService {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Service name.
  string name = 1;

  // Service type.
  string type = 2;

  // External port.
  uint32 external_port = 3 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];

  // Internal port.
  uint32 internal_port = 4 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];

  // TLS port settings.
  GlobalGitalyServiceTls tls = 5;
}

// GlobalGitalyServiceTls configures the TLS ports for the Gitaly Service.
message GlobalGitalyServiceTls {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // External TLS port.
  uint32 external_port = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];

  // Internal TLS port.
  uint32 internal_port = 2 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];
}

// GlobalGitalyTls configures Gitaly (or Praefect) TLS.
message GlobalGitalyTls {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Whether TLS is enabled.
  bool enabled = 1;

  // TLS secret name.
  string secret_name = 2;
}

// GlobalGitalyClient configures Gitaly client retry behavior.
message GlobalGitalyClient {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Maximum retry attempts.
  uint32 max_attempts = 1;

  // Initial backoff (duration string).
  string initial_backoff = 2;

  // Maximum backoff (duration string).
  string max_backoff = 3;
}

// GlobalPraefect configures Praefect (Gitaly Cluster).
message GlobalPraefect {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Whether Praefect is enabled.
  bool enabled = 1;

  // NTP host used for health checks.
  string ntp_host = 2;

  // Whether Praefect replaces internal Gitaly.
  bool replace_internal_gitaly = 3;

  // Praefect auth token secret reference.
  GlobalSecretRef auth_token = 4;

  // Whether to auto-migrate the Praefect database.
  bool auto_migrate = 5;

  // Praefect database secret reference.
  GlobalSecretRef db_secret = 6;

  // Virtual storages.
  repeated GlobalPraefectVirtualStorage virtual_storages = 7;

  // Praefect PostgreSQL settings.
  GlobalPraefectPsql psql = 8;

  // Service name override.
  string service_name = 9;

  // Praefect Service settings.
  GlobalGitalyService service = 10;

  // Praefect TLS settings.
  GlobalGitalyTls tls = 11;
}

// GlobalPraefectVirtualStorage configures a Praefect virtual storage.
message GlobalPraefectVirtualStorage {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Virtual storage name.
  string name = 1;

  // Number of Gitaly replicas.
  uint32 gitaly_replicas = 2;

  // Maximum unavailable replicas.
  uint32 max_unavailable = 3;
}

// GlobalPraefectPsql configures the Praefect PostgreSQL connection.
message GlobalPraefectPsql {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // SSL mode.
  string ssl_mode = 1;
}

// GlobalAppConfig models the shared Rails application configuration.
message GlobalAppConfig {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // CDN host.
  string cdn_host = 1;

  // Relative URL root.
  string relative_url_root = 2;

  // Whether usage ping is enabled.
  bool enable_usage_ping = 3;

  // Whether seat link is enabled.
  bool enable_seat_link = 4;

  // Whether impersonation is enabled.
  bool enable_impersonation = 5;

  // Application settings cache TTL in seconds.
  uint32 application_settings_cache_seconds = 6;

  // Whether username changing is enabled.
  bool username_changing_enabled = 7;

  // Issue closing pattern (regex).
  string issue_closing_pattern = 8;

  // Default theme ID.
  int32 default_theme = 9;

  // Default color mode.
  string default_color_mode = 10;

  // Default syntax highlighting theme ID.
  int32 default_syntax_highlighting_theme = 11;

  // Default features for new projects.
  GlobalDefaultProjectsFeatures default_projects_features = 12;

  // Git import/fetch timeout in seconds.
  uint32 git_timeout = 13;

  // GraphQL timeout in seconds.
  uint32 graph_ql_timeout = 14;

  // Webhook timeout in seconds.
  uint32 webhook_timeout = 15;

  // Maximum request duration in seconds.
  uint32 max_request_duration_seconds = 16;

  // CI ID token settings.
  GlobalCiIdTokens ci_id_tokens = 17;

  // Cron job overrides (freeform).
  google.protobuf.Struct cron_jobs = 18 [(gitlab.config.helm_name) = "cron_jobs"];

  // Content Security Policy settings.
  GlobalContentSecurityPolicy content_security_policy = 19;

  // Gravatar/Libravatar settings.
  GlobalGravatar gravatar = 20;

  // Analytics/tracking service settings.
  GlobalAppConfigExtra extra = 21;

  // Default object storage settings.
  GlobalObjectStore object_store = 22 [(gitlab.config.helm_name) = "object_store"];

  // Git LFS object storage settings.
  GlobalLfs lfs = 23;

  // Artifacts object storage settings.
  GlobalArtifacts artifacts = 24;

  // Uploads object storage settings.
  GlobalUploads uploads = 25;

  // Packages object storage settings.
  GlobalPackages packages = 26;

  // External MR diffs object storage settings.
  GlobalExternalDiffs external_diffs = 27;

  // Terraform state object storage settings.
  GlobalTerraformState terraform_state = 28;

  // CI secure files object storage settings.
  GlobalCiSecureFiles ci_secure_files = 29;

  // Agent plan content object storage settings.
  GlobalAgentPlanContent agent_plan_content = 30;

  // Dependency proxy object storage settings.
  GlobalDependencyProxy dependency_proxy = 31;

  // Backup bucket settings.
  GlobalBackups backups = 32;

  // Microsoft Graph mailer settings.
  GlobalMicrosoftGraphMailer microsoft_graph_mailer = 33 [(gitlab.config.helm_name) = "microsoft_graph_mailer"];

  // Incoming email settings.
  GlobalMailroomEmail incoming_email = 34;

  // Service Desk email settings.
  GlobalMailroomEmail service_desk_email = 35;

  // LDAP settings.
  GlobalLdap ldap = 36;

  // GitLab Duo auth settings.
  GlobalDuoAuth duo_auth = 37;

  // Knowledge graph settings.
  GlobalKnowledgeGraph knowledge_graph = 38;

  // KAS-related appConfig settings.
  GlobalAppConfigGitlabKas gitlab_kas = 39 [(gitlab.config.helm_name) = "gitlab_kas"];

  // IAM-Auth service settings.
  GlobalIamAuthService iam_auth_service = 40;

  // IAM Data Access service settings.
  GlobalIamDataAccessService iam_data_access_service = 41;

  // Workspaces appConfig settings (freeform).
  google.protobuf.Struct workspaces = 42;

  // GitLab Cells settings (experimental).
  GlobalCell cell = 43;

  // OmniAuth settings.
  GlobalOmniauth omniauth = 44;

  // Kerberos settings.
  GlobalKerberos kerberos = 45;

  // Sentry settings.
  GlobalSentry sentry = 46;

  // GitLab Docs settings.
  GlobalGitlabDocs gitlab_docs = 47 [(gitlab.config.helm_name) = "gitlab_docs"];

  // OIDC provider settings.
  GlobalOidcProvider oidc_provider = 48;

  // Smartcard auth settings.
  GlobalSmartcard smartcard = 49;

  // Sidekiq appConfig settings.
  GlobalAppConfigSidekiq sidekiq = 50;

  // Config applied only to defaults on initial install (freeform).
  google.protobuf.Struct initial_defaults = 51;

  // ActionCable allowed request origins.
  repeated string action_cable_allowed_origins = 52;
}

// GlobalDefaultProjectsFeatures sets default features for new projects.
message GlobalDefaultProjectsFeatures {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Issues enabled by default.
  bool issues = 1;

  // Merge requests enabled by default.
  bool merge_requests = 2;

  // Wiki enabled by default.
  bool wiki = 3;

  // Snippets enabled by default.
  bool snippets = 4;

  // Builds (CI) enabled by default.
  bool builds = 5;
}

// GlobalCiIdTokens configures CI ID tokens.
message GlobalCiIdTokens {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Issuer URL.
  string issuer_url = 1;
}

// GlobalContentSecurityPolicy configures the Content Security Policy.
message GlobalContentSecurityPolicy {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Whether CSP is enabled.
  bool enabled = 1;

  // Whether CSP is report-only.
  bool report_only = 2 [(gitlab.config.helm_name) = "report_only"];

  // CSP directives (freeform).
  google.protobuf.Struct directives = 3;
}

// GlobalGravatar configures Gravatar/Libravatar.
message GlobalGravatar {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Plain (HTTP) URL.
  string plain_url = 1;

  // SSL (HTTPS) URL.
  string ssl_url = 2;
}

// GlobalAppConfigExtra configures analytics/tracking services.
message GlobalAppConfigExtra {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Google Analytics ID.
  string google_analytics_id = 1;

