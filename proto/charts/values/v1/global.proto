// GlobalSmtp configures the outgoing SMTP server.
message GlobalSmtp {
  option (gitlab.config.helm_naming) = HELM_NAMING_CONVENTION_CAMEL_CASE;

  // Whether SMTP is enabled.
  bool enabled = 1;

  // SMTP server address.
  string address = 2;

  // SMTP server port.
  uint32 port = 3 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];

  // SMTP username.
  string user_name = 4 [(gitlab.config.helm_name) = "user_name"];

  // SMTP username secret reference.
  GlobalSecretRef user_name_secret = 5 [(gitlab.config.helm_name) = "user_name_secret"];

  // SMTP password secret reference.
  GlobalSecretRef password = 6;

  // SMTP HELO domain.
  string domain = 7;

  // SMTP authentication method.
  string authentication = 8;

  // Whether to auto-negotiate STARTTLS.
  bool starttls_auto = 9 [(gitlab.config.helm_name) = "starttls_auto"];

  // OpenSSL verify mode.
  string openssl_verify_mode = 10 [(gitlab.config.helm_name) = "openssl_verify_mode"];

  // Open timeout in seconds.
  uint32 open_timeout = 11 [(gitlab.config.helm_name) = "open_timeout"];

  // Read timeout in seconds.
  uint32 read_timeout = 12 [(gitlab.config.helm_name) = "read_timeout"];

  // Whether to use a connection pool.
  bool pool = 13;
}

